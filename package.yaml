name:                haskell-elgato-streamdeck
version:             0.1.0.0
github:              "bendo/haskell-elgato-streamdeck"
license:             BSD3
author:              "Zdenko Osina"
maintainer:          "zdeno.osina@gmail.com"
copyright:           "2022 Zdenko Osina"
synopsis:            Build small Haskell applications for the Elgato Stream Deck
category:            Hardware
tested-with:         GHC == 9.10.3

extra-source-files:
- README.md
- ChangeLog.md
- examples/MyDeck.hs
- examples/Radio.hs
- examples/FontAwesome.hs
- examples/Pages.hs
- fonts/fontawesome/README.md
- fonts/dejavu/README.md

data-files:
- fonts/fontawesome/*.ttf
- fonts/fontawesome/LICENSE.txt
- fonts/dejavu/DejaVuSans.ttf
- fonts/dejavu/LICENSE.txt

description:         Please see the README on GitHub at <https://github.com/bendo/haskell-elgato-streamdeck#readme>

language: Haskell2010
ghc-options:
- -Wall
- -Wcompat

dependencies:
- base >= 4.20 && < 5

library:
  source-dirs: src
  c-sources:
  - cbits/read_timeout.c
  - cbits/x11_keyboard.c
  cc-options: -pthread
  extra-libraries: pthread
  pkg-config-dependencies:
  - x11 >= 1.6
  - xtst >= 1.2
  dependencies:
  - hidapi >= 0.1.8 && < 0.2
  - bytestring >= 0.11 && < 0.13
  - JuicyPixels >= 3.3 && < 3.4
  - async >= 2.2 && < 2.3
  - FontyFruity >= 0.5.3.5 && < 0.6
  - Rasterific >= 0.7.5.4 && < 0.8
  - vector >= 0.13 && < 0.14
  - containers >= 0.6 && < 0.8
  - process >= 1.6 && < 1.7
  - stm >= 2.5 && < 2.6
  - time >= 1.12 && < 1.15
  - tz >= 0.1.3.6 && < 0.2

executables:
  haskell-elgato-streamdeck-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - haskell-elgato-streamdeck
    - hidapi >= 0.1.8 && < 0.2

tests:
  haskell-elgato-streamdeck-test:
    main:                Spec.hs
    source-dirs:         test
    c-sources: test/cbits/x11_fixture.c
    pkg-config-dependencies:
    - x11 >= 1.6
    - xtst >= 1.2
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - haskell-elgato-streamdeck
    - bytestring >= 0.11 && < 0.13
    - JuicyPixels >= 3.3 && < 3.4
    - HUnit >= 1.6 && < 1.7
    - async >= 2.2 && < 2.3
    - hidapi >= 0.1.8 && < 0.2
    - directory >= 1.3 && < 1.4
    - containers >= 0.6 && < 0.8
    - stm >= 2.5 && < 2.6
    - time >= 1.12 && < 1.15
