name:                haskell-elgato-streamdeck
version:             0.1.0.0
github:              "bendo/haskell-elgato-streamdeck"
license:             BSD3
author:              "Zdenko Osina"
maintainer:          "zdeno.osina@gmail.com"
copyright:           "2022 Zdenko Osina"
synopsis:            Build small Haskell applications for the Elgato Stream Deck
category:            Hardware
tested-with:         GHC == 9.10.3

extra-source-files:
- README.md
- ChangeLog.md
- examples/MyDeck.hs

description:         Please see the README on GitHub at <https://github.com/bendo/haskell-elgato-streamdeck#readme>

language: Haskell2010
ghc-options:
- -Wall
- -Wcompat

dependencies:
- base >= 4.20 && < 5

library:
  source-dirs: src
  dependencies:
  - hidapi >= 0.1.8 && < 0.2
  - bytestring >= 0.11 && < 0.13
  - JuicyPixels >= 3.3 && < 3.4
  - async >= 2.2 && < 2.3

executables:
  haskell-elgato-streamdeck-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - haskell-elgato-streamdeck
    - hidapi >= 0.1.8 && < 0.2

tests:
  haskell-elgato-streamdeck-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - haskell-elgato-streamdeck
    - bytestring >= 0.11 && < 0.13
    - JuicyPixels >= 3.3 && < 3.4
    - HUnit >= 1.6 && < 1.7
    - async >= 2.2 && < 2.3
    - hidapi >= 0.1.8 && < 0.2
